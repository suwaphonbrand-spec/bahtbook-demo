/* ============================ CSV + backup ============================ */
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCSV() {
  const head = ["date", "type", "account", "to_account", "amount", "currency", "category", "payee", "note", "tags", "cleared", "splits"];
  const lines = [head.join(",")];
  allTx().slice().reverse().forEach(x => {
    const a = accById(x.acct), to = x.to ? accById(x.to) : null;
    lines.push([
      x.date, x.type, a ? a.name : "", to ? to.name : "", x.amount, a ? a.currency : S.settings.currency,
      x.splits || !x.cat ? "" : catFull(x.cat), x.payee || "", x.note || "", (x.tags || []).join(";"), x.cleared ? "1" : "0",
      x.splits ? x.splits.map(s => catFull(s.cat) + ":" + s.amount).join("|") : ""
    ].map(csvCell).join(","));
  });
  return lines.join("\r\n");
}
/* Excel saves ; separated files in many locales, and some apps export tabs */
function sniffDelimiter(s) {
  const first = (s.split(/\r?\n/)[0] || "");
  const n = { ",": 0, ";": 0, "\t": 0 };
  let q = false;
  for (let i = 0; i < first.length; i++) { const c = first[i]; if (c === '"') q = !q; else if (!q && n[c] != null) n[c]++; }
  let d = ",";
  if (n[";"] > n[d]) d = ";";
  if (n["\t"] > n[d]) d = "\t";
  return d;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  const s = text.replace(/^﻿/, "");
  const D = sniffDelimiter(s);
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === D) { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
/* statements write negatives as -100, (100) or 100- */
function parseSignedAmount(v) {
  let s = String(v == null ? "" : v).trim();
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/-\s*$/.test(s)) { neg = true; s = s.replace(/-\s*$/, ""); }
  if (/^\s*-/.test(s)) neg = true;
  s = s.replace(/[^\d.]/g, "");
  const n = parseFloat(s);
  if (!isFinite(n)) return NaN;
  return neg ? -Math.abs(n) : Math.abs(n);
}
function normDate(v) {
  const s = String(v || "").trim();
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return m[1] + "-" + String(m[2]).padStart(2, "0") + "-" + String(m[3]).padStart(2, "0");
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
  if (m) { let y = +m[3]; if (y > 2400) y -= 543; return y + "-" + String(m[2]).padStart(2, "0") + "-" + String(m[1]).padStart(2, "0"); }
  const d = new Date(s);
  return isNaN(d) ? null : iso(d);
}
function ensureAccount(name, cur) {
  const n = String(name || "").trim() || (LANG === "th" ? "นำเข้า" : "Imported");
  let a = S.accounts.find(x => x.name.toLowerCase() === n.toLowerCase());
  if (!a) { a = { id: uid(), name: n, type: "bank", currency: cur || S.settings.currency, opening: 0, color: ACCT_COLORS[S.accounts.length % ACCT_COLORS.length], note: "", archived: false, order: S.accounts.length, creditLimit: 0 }; S.accounts.push(a); }
  return a.id;
}
function ensureCategory(path, kind) {
  const raw = String(path || "").trim();
  if (!raw) return null;
  // only " · " and ">" separate parent from child -- "/" is common inside Thai category names
  const parts = raw.split(/\s+·\s+|\s*[>»]\s*/).filter(Boolean);
  let parentId = null;
  parts.forEach((nm, idx) => {
    const clean = nm.replace(/^[^\p{L}\p{N}]+/u, "").trim() || nm;
    const same = x => x.kind === kind && x.name.toLowerCase() === clean.toLowerCase();
    let c = S.categories.find(x => same(x) && (idx === 0 ? !x.parent : x.parent === parentId));
    // a file that names only "Coffee" means the existing Coffee, even though it sits under Food
    if (!c && parts.length === 1) c = S.categories.find(same);
    if (!c) { c = { id: uid(), name: clean, en: null, kind: kind, parent: idx === 0 ? null : parentId, icon: idx === 0 ? "📦" : "·", archived: false, order: S.categories.length }; S.categories.push(c); }
    parentId = c.id;
  });
  return parentId;
}
function importCSVText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast(LANG === "th" ? "ไฟล์ไม่มีข้อมูล" : "No rows found"); return; }
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const col = names => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
  const C = {
    date: col(["date", "วันที่", "วัน", "transaction date"]),
    type: col(["type", "ประเภท", "kind"]),
    acct: col(["account", "บัญชี", "account name", "from account", "from_account"]),
    to: col(["to_account", "to account", "เข้าบัญชี", "transfer to"]),
    amount: col(["amount", "จำนวน", "จำนวนเงิน", "value", "total"]),
    cur: col(["currency", "สกุลเงิน"]),
    cat: col(["category", "หมวด", "หมวดหมู่", "categories"]),
    payee: col(["payee", "ร้าน", "ผู้รับ", "merchant", "description", "name"]),
    note: col(["note", "notes", "บันทึก", "memo", "comment"]),
    tags: col(["tags", "แท็ก", "tag", "labels"]),
    cleared: col(["cleared", "reconciled"]),
    splits: col(["splits"])
  };
  if (C.date < 0 || C.amount < 0) { toast(LANG === "th" ? "ต้องมีคอลัมน์ date และ amount" : "Needs date and amount columns"); return; }
  const touched = {}; let n = 0, bad = 0;
  rows.slice(1).forEach(r => {
    const date = normDate(r[C.date]);
    const num = parseSignedAmount(r[C.amount]);
    if (!date || !isFinite(num) || num === 0) { bad++; return; }
    let type = String(C.type >= 0 ? r[C.type] : "").trim().toLowerCase();
    if (/transfer|โอน/.test(type)) type = "transfer";
    else if (/income|รายรับ|รับ|credit|deposit/.test(type)) type = "income";
    else if (/expense|รายจ่าย|จ่าย|debit|withdraw/.test(type)) type = "expense";
    else type = num < 0 ? "expense" : "income";
    const cur = C.cur >= 0 ? String(r[C.cur] || "").trim().toUpperCase() : "";
    const acct = ensureAccount(C.acct >= 0 ? r[C.acct] : "", CUR_SYM[cur] ? cur : "");
    const to = type === "transfer" ? ensureAccount(C.to >= 0 ? r[C.to] : (LANG === "th" ? "ปลายทาง" : "Destination"), CUR_SYM[cur] ? cur : "") : null;
    const kind = type === "income" ? "income" : "expense";
    let splits = null;
    if (C.splits >= 0 && String(r[C.splits] || "").trim()) {
      splits = String(r[C.splits]).split("|").map(p => { const i = p.lastIndexOf(":"); return { cat: ensureCategory(p.slice(0, i), kind), amount: r2(Math.abs(parseFloat(p.slice(i + 1)) || 0)), note: "" }; }).filter(s => s.amount > 0);
      if (!splits.length) splits = null;
    }
    const tx = {
      id: uid(), date: date, type: type, acct: acct, to: to, amount: r2(Math.abs(num)), toAmount: null,
      cat: type === "transfer" || splits ? null : ensureCategory(C.cat >= 0 ? r[C.cat] : "", kind),
      payee: type === "transfer" ? "" : String(C.payee >= 0 ? r[C.payee] : "").trim(),
      note: String(C.note >= 0 ? r[C.note] : "").trim(),
      tags: String(C.tags >= 0 ? r[C.tags] : "").split(/[;,]/).map(s => s.trim()).filter(Boolean),
      cleared: C.cleared >= 0 ? /^(1|true|yes|y|ใช่)$/i.test(String(r[C.cleared]).trim()) : false,
      splits: splits, createdAt: Date.now(), updatedAt: Date.now()
    };
    const mk = mkey(date);
    (S.tx[mk] = S.tx[mk] || []).push(tx);
    touched[mk] = 1; n++;
  });
  invalidate();
  persist("accounts"); persist("categories");
  Object.keys(touched).forEach(mk => persistMonth(mk));
  render();
  toast((LANG === "th" ? "นำเข้า " : "Imported ") + n + (LANG === "th" ? " รายการ" : " entries") + (bad ? (LANG === "th" ? " · ข้าม " : " · skipped ") + bad : ""));
}
function pickFile(accept, cb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept; inp.style.display = "none";
  document.body.appendChild(inp);
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0];
    if (f) { const fr = new FileReader(); fr.onload = () => cb(String(fr.result)); fr.readAsText(f); }
    inp.remove();
  });
  inp.click();
}
async function offerDownload(filename, text) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {}
  if (dl) {
    try { await dl.save({ filename: filename, data: text }); toast(LANG === "th" ? "บันทึกไฟล์แล้ว" : "File saved"); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  openSheet({
    title: filename,
    body: '<p class="hint" style="margin:0">' + esc(LANG === "th" ? "คัดลอกข้อความทั้งหมดนี้ไปวางในไฟล์ได้เลย" : "Copy this text into a file") + "</p>" +
      '<textarea class="inp" id="dl-text" style="min-height:220px;font-family:var(--f-num);font-size:12px" readonly></textarea>',
    footer: '<button class="btn" data-sheet-close>' + esc(t("close")) + '</button><button class="btn p" data-sheet-ok>' + esc(LANG === "th" ? "คัดลอก" : "Copy") + "</button>",
    onMount: el => { $("#dl-text", el).value = text; },
    onOk: el => {
      const ta = $("#dl-text", el);
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(LANG === "th" ? "คัดลอกแล้ว" : "Copied"), () => toast(LANG === "th" ? "เลือกข้อความแล้ว กด Ctrl+C" : "Selected — press Ctrl+C"));
      else toast(LANG === "th" ? "เลือกข้อความแล้ว กด Ctrl+C" : "Selected — press Ctrl+C");
    }
  });
}
function backupJSON() {
  return JSON.stringify({ app: "bahtbook", version: 1, exported: new Date().toISOString(), settings: S.settings, accounts: S.accounts, categories: S.categories, payees: S.payees, recurring: S.recurring, budgets: S.budgets, index: S.index, tx: S.tx }, null, 1);
}
function restoreJSON(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast(LANG === "th" ? "ไฟล์ไม่ถูกต้อง" : "Invalid file"); return; }
  if (!d || d.app !== "bahtbook" || !d.accounts) { toast(LANG === "th" ? "ไม่ใช่ไฟล์สำรองของแอพนี้" : "Not a backup from this app"); return; }
  confirmSheet(LANG === "th" ? "แทนที่ข้อมูลทั้งหมดด้วยไฟล์นี้?" : "Replace all data with this file?", t("yes"), () => {
    Object.keys(S.tx).forEach(mk => lsDel("m_" + mk));
    S.settings = Object.assign(DEFAULT_SETTINGS(), d.settings || {});
    S.accounts = d.accounts || []; S.categories = d.categories || []; S.payees = d.payees || [];
    S.recurring = d.recurring || []; S.budgets = d.budgets || { tpl: {}, m: {}, roll: {} };
    S.tx = d.tx || {}; S.index = { months: d.index && d.index.months ? d.index.months : {} };
    S.del = {};
    Object.keys(S.tx).forEach(mk => { if (!S.index.months[mk]) S.index.months[mk] = 1; });
    LANG = S.settings.lang || LANG; invalidate(); applyTheme();
    wipeRemote().then(() => persistAll({ replace: true }));
    render(); toast(LANG === "th" ? "กู้คืนแล้ว" : "Restored");
  }, false, LANG === "th" ? "บัญชี รายการ งบประมาณ และการตั้งค่าที่มีอยู่ตอนนี้จะถูกแทนที่ทั้งหมด" : "Every account, entry, budget and setting currently in the app will be replaced.");
}
function resetAll() {
  confirmSheet(t("confirmReset"), t("yes"), () => {
    Object.keys(S.tx).forEach(mk => lsDel("m_" + mk));
    CORE_KEYS.forEach(lsDel);
    const curLang = LANG;
    seedBase(); S.settings.lang = curLang; LANG = curLang;
    invalidate();
    wipeRemote().then(() => persistAll({ replace: true }));
    render(); toast(t("deleted"));
  });
}

/* ============================ global events ============================ */
document.addEventListener("click", ev => {
  const el = ev.target;
  const key = el.closest("[data-key]");
  if (key) { pinKey(key.dataset.key); return; }
  if (el.closest("#pin-forgot")) {
    confirmSheet(LANG === "th" ? "เลิกใช้ PIN?" : "Turn off the PIN?", t("removePin"), () => {
      S.settings.pin = null; persist("settings"); hideLock(); render();
    }, false,
    LANG === "th" ? "แอพจะไม่ถามรหัสอีกบนทุกเครื่องที่ใช้ลิงก์นี้ ข้อมูลไม่ถูกลบ และตั้งรหัสใหม่ได้ในหน้าตั้งค่า"
      : "The app stops asking for a code on every device using this link. Nothing is deleted, and you can set a new code in Settings.");
    return;
  }
  if (el.closest("#si-google")) { signInWithGoogle(); return; }
  if (el.closest("#si-skip")) { hideSignIn(); return; }
  const goBtn = el.closest("[data-go]"); if (goBtn) { go(goBtn.dataset.go); return; }
  const acctBtn = el.closest("[data-acct]"); if (acctBtn) { UI.reg = { acct: acctBtn.dataset.acct, q: "", type: "", cat: "", from: "", to: "", uncleared: false, limit: 150 }; go("register"); return; }
  const openAcct = el.closest("[data-open-acct]"); if (openAcct) { UI.reg = { acct: openAcct.dataset.openAcct, q: "", type: "", cat: "", from: "", to: "", uncleared: false, limit: 150 }; go("register"); return; }
  const editAcct = el.closest("[data-edit-acct]"); if (editAcct) { acctSheet(accById(editAcct.dataset.editAcct)); return; }
  const mn = el.closest("[data-month]");
  if (mn) { const d = Number(mn.dataset.month); if (d) { UI.month = addMonthKey(UI.month, d); render(); } else { UI.month = mkey(todayISO()); render(); } return; }
  const txBtn = el.closest("[data-tx]"); if (txBtn) { const x = findTx(txBtn.dataset.tx); if (x) txSheet(x); return; }
  const bc = el.closest("[data-budget-cat]"); if (bc) { if (bc.dataset.budgetCat !== "_none") budgetSheet(bc.dataset.budgetCat); return; }
  const ra = el.closest("[data-reg-acct]"); if (ra) { UI.reg.acct = ra.dataset.regAcct; UI.reg.limit = 150; render(); return; }
  const rc = el.closest("[data-reg-clear]");
  if (rc) {
    const k = rc.dataset.regClear;
    if (k === "all") UI.reg = { acct: UI.reg.acct, q: "", type: "", cat: "", from: "", to: "", uncleared: false, limit: 150 };
    else if (k === "date") { UI.reg.from = ""; UI.reg.to = ""; }
    else if (k === "uncleared") UI.reg.uncleared = false;
    else UI.reg[k] = "";
    render(); return;
  }
  const rm = el.closest("[data-rep-mode]"); if (rm) { UI.rep.mode = rm.dataset.repMode; render(); return; }
  const rp = el.closest("[data-rep-page]"); if (rp) { UI.rep.page = rp.dataset.repPage; render(); return; }
  const rk = el.closest("[data-rep-kind]"); if (rk) { UI.rep.kind = rk.dataset.repKind; render(); return; }
  const rcat = el.closest("[data-rep-cat]");
  if (rcat) { const r = repRange(); UI.reg = { acct: "", q: "", type: "", cat: rcat.dataset.repCat === "_none" ? "" : rcat.dataset.repCat, from: r.from, to: r.to, uncleared: false, limit: 150 }; go("register"); return; }
  const pr = el.closest("[data-post-rec]"); if (pr) { postRecNow(pr.dataset.postRec); return; }
  const st = el.closest("[data-set-theme]"); if (st) { S.settings.theme = st.dataset.setTheme; applyTheme(); persist("settings"); render(); return; }
  const sl = el.closest("[data-set-lang]"); if (sl) { LANG = sl.dataset.setLang; S.settings.lang = LANG; persist("settings"); render(); return; }

  const act = el.closest("[data-act]");
  if (!act) return;
  switch (act.dataset.act) {
    case "new-tx": txSheet(null, UI.reg.acct ? { acct: UI.reg.acct } : null); break;
    case "new-acct": acctSheet(null); break;
    case "accounts": closeAllSheets(); go("accounts"); break;
    case "google-signin": signInWithGoogle(); break;
    case "google-signout":
      confirmSheet(LANG === "th" ? "ออกจากระบบ?" : "Sign out?", LANG === "th" ? "ออกจากระบบ" : "Sign out", signOutOfGoogle, false,
        LANG === "th" ? "ข้อมูลยังอยู่ใน Google Drive ของคุณครบถ้วน เข้าสู่ระบบใหม่เมื่อไหร่ก็ได้ข้อมูลกลับมาเหมือนเดิม" : "Your data stays in your Google Drive. Signing back in brings it all back.");
      break;
    case "cat-manage": catManager(); break;
    case "ct-new": catSheet(null); break;
    case "rec-manage": recManager(); break;
    case "rc-new": recSheet(null); break;
    case "payee-manage": payeeManager(); break;
    case "reg-search": case "reg-filter": regFilterSheet(); break;
    case "reg-more": UI.reg.limit = (UI.reg.limit || 150) + 300; render(); break;
    case "rm-demo": confirmSheet(t("removeDemo") + "?", t("yes"), removeDemo); break;
    case "copy-last": copyLastMonth(); break;
    case "set-pin": showLock("set"); break;
    case "remove-pin": confirmSheet(t("removePin") + "?", t("yes"), () => { S.settings.pin = null; persist("settings"); render(); }, false); break;
    case "export-csv": offerDownload("bahtbook-" + todayISO() + ".csv", buildCSV()); break;
    case "import-csv": pickFile(".csv,text/csv,text/plain", importCSVText); break;
    case "backup": offerDownload("bahtbook-backup-" + todayISO() + ".json", backupJSON()); break;
    case "restore": pickFile(".json,application/json", restoreJSON); break;
    case "reset": resetAll(); break;
  }
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && SHEETS.length) { closeSheet(); return; }
  if (UI.pinState) { if (/^[0-9]$/.test(ev.key)) pinKey(ev.key); else if (ev.key === "Backspace") pinKey("⌫"); return; }
  if (SHEETS.length) return;
  if ((ev.key === "n" || ev.key === "N") && !ev.metaKey && !ev.ctrlKey && document.activeElement === document.body) { ev.preventDefault(); txSheet(null); }
});
$("#side-add-acct").addEventListener("click", () => acctSheet(null));
window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => { if ((S.settings.theme || "auto") === "auto") render(); });
window.addEventListener("online", () => flushDirty());
document.addEventListener("visibilitychange", () => { if (!document.hidden) flushDirty(); });

/* ============================ start ============================ */
const START_PAGE = (location.hash || "").replace("#", "");
if (["overview", "accounts", "register", "budget", "reports", "settings"].indexOf(START_PAGE) >= 0) UI.page = START_PAGE;
boot();
