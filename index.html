<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Budget &amp; Finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&family=Trirong:wght@400;500;600&display=swap">
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Budget & Finance — "สมุดบัญชี"

   The page is a sheet of ledger paper, not a stack of cards. Structure comes
   from ruled lines and from where the figures sit, so almost nothing has a
   border, a corner radius or a shadow. Rules:
     · one hairline between rows, one solid ink rule to open a section,
       one double rule under the headline figure — and nothing else
     · every figure is monospaced and right-aligned so the columns line up
     · red means money leaving, the way it does in a paper ledger
     · no icons standing in for words
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --paper:#f6f5f1; --paper-2:#efeee8; --paper-3:#e6e3d9;
  --ink:#1b1d22; --ink-dim:#6f6a5e; --ink-mute:#8c8778;
  --rule:#d9d5c9; --rule-soft:#e6e2d7;
  --neg:#9e2b25; --pos:#2f6b3f; --warn:#8a5c00; --xfer:#42526e;
  --neg-soft:#f2e3e0; --pos-soft:#e3ebe2; --warn-soft:#f4ead3; --xfer-soft:#e4e7ee;
  --f-ui:"Sarabun","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-display:"Trirong",Georgia,serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15140f; --paper-2:#1c1b15; --paper-3:#26241c;
  --ink:#eae5d8; --ink-dim:#a9a292; --ink-mute:#7e7867;
  --rule:#35322a; --rule-soft:#262319;
  --neg:#e08a7e; --pos:#86b08c; --warn:#cfa44d; --xfer:#93a3c0;
  --neg-soft:#2e1f1c; --pos-soft:#1c2a1f; --warn-soft:#2c2415; --xfer-soft:#1e232d;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15140f; --paper-2:#1c1b15; --paper-3:#26241c;
  --ink:#eae5d8; --ink-dim:#a9a292; --ink-mute:#7e7867;
  --rule:#35322a; --rule-soft:#262319;
  --neg:#e08a7e; --pos:#86b08c; --warn:#cfa44d; --xfer:#93a3c0;
  --neg-soft:#2e1f1c; --pos-soft:#1c2a1f; --warn-soft:#2c2415; --xfer-soft:#1e232d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.55;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .xf{color:var(--xfer)} .dim{color:var(--ink-dim)} .mute{color:var(--ink-mute)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:0;text-wrap:balance}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute)}
.hide{display:none!important}

/* ───────── shell ───────── */
#app{display:flex;height:100%;min-height:0}
#side{display:none;width:250px;flex:0 0 250px;flex-direction:column;background:var(--paper);border-right:1px solid var(--ink);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:30px;height:30px;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;flex:0 0 auto}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em}
.brand-sub{font-size:9.5px;color:var(--ink-mute);letter-spacing:.2em}
#sidenav{display:flex;flex-direction:column;padding:4px 0;border-top:1px solid var(--rule)}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 18px;border:0;background:none;text-align:left;color:var(--ink-dim);font-weight:400;font-size:14.5px;width:100%;border-left:2px solid transparent}
.navbtn:hover{color:var(--ink)}
.navbtn[aria-current="page"]{color:var(--ink);font-weight:600;border-left-color:var(--ink)}
.navbtn svg{width:16px;height:16px;flex:0 0 auto;opacity:.75}
.navbtn[aria-current="page"] svg{opacity:1}
.side-scroll{flex:1;min-height:0;overflow:auto;padding:0 18px 20px}
.side-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 4px;border-bottom:1px solid var(--rule)}
.acct-row{display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:none;padding:7px 0;border-bottom:1px solid var(--rule-soft);text-align:left}
.acct-row:hover .acct-name{text-decoration:underline;text-underline-offset:2px}
.acct-dot{width:6px;height:6px;flex:0 0 auto;align-self:center}
.acct-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.acct-bal{font-size:12.5px}
.networth{padding:16px 0 12px;border-bottom:3px double var(--ink)}
.networth .v{font-family:var(--f-num);font-size:23px;font-weight:500;letter-spacing:-.035em;margin-top:2px}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;align-items:center;gap:8px;padding:12px max(14px,env(safe-area-inset-right,0px)) 11px max(14px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--ink);flex:0 0 auto;min-height:52px}
#topbar h1{font-family:var(--f-display);font-size:19px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#screens{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.screen{padding:0 max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px));max-width:860px;margin:0 auto}
#tabbar{display:flex;flex:0 0 auto;background:var(--paper);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbtn{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:var(--ink-mute);font-size:10.5px;min-width:0;border-top:2px solid transparent;margin-top:-1px}
.tabbtn svg{width:19px;height:19px}
.tabbtn[aria-current="page"]{color:var(--ink);font-weight:600;border-top-color:var(--ink)}
@media (min-width:900px){ #side{display:flex} #tabbar{display:none} }

/* ───────── controls ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 13px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:400;font-size:13.5px;white-space:nowrap;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.p{background:var(--ink);color:var(--paper);font-weight:500}
.btn.p:hover{opacity:.85}
.btn.g{border-color:transparent;color:var(--ink-dim);padding-inline:6px}
.btn.g:hover{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.btn.d{border-color:var(--neg);color:var(--neg)}
.btn.d:hover{background:var(--neg);color:var(--paper)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn svg{width:14px;height:14px}
.icon-btn{width:32px;height:32px;padding:0;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink-dim);flex:0 0 auto;border-radius:2px}
.icon-btn:hover{color:var(--ink);border-color:var(--rule)}
.icon-btn svg{width:17px;height:17px}
.seg{display:inline-flex;border:1px solid var(--rule);max-width:100%;border-radius:2px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 11px;font-size:13px;color:var(--ink-dim);white-space:nowrap;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:500}
.seg.big{display:flex;width:100%;border-color:var(--ink)}
.seg.big button{padding:9px 0;flex:1;font-size:14px;border-right-color:var(--ink)}
.seg.big button[aria-pressed="true"].t-expense{background:var(--neg);color:#fff;border-color:var(--neg)}
.seg.big button[aria-pressed="true"].t-income{background:var(--pos);color:#fff;border-color:var(--pos)}
.seg.big button[aria-pressed="true"].t-transfer{background:var(--xfer);color:#fff;border-color:var(--xfer)}

/* ───────── sections: a rule opens one, a hairline separates rows ───────── */
.card{background:transparent;border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--ink);margin-top:26px}
.card-h{display:flex;align-items:baseline;gap:10px;padding:9px 0 7px;border-bottom:1px solid var(--rule)}
.card-h h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);flex:1;min-width:0}
.card-b{padding:0}
.card.notice{border-top:0;border-left:3px solid var(--ink);padding:10px 0 10px 13px;margin-top:18px;background:transparent}
.card.notice .card-b{font-size:13px;color:var(--ink-dim)}
.card.notice.warn{border-left-color:var(--warn)}
.grid{display:grid;gap:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:0 34px}
.g3,.g4{display:flex;gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.sec{margin-bottom:0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 0;padding:9px 0 7px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.sec-h h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);flex:1;min-width:0}

/* the headline figure, then a double rule — the only one on the page */
.ledger-head{padding:22px 0 14px;border-bottom:3px double var(--ink)}
.ledger-head .k{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute)}
.ledger-head .v{font-family:var(--f-num);font-size:34px;font-weight:500;letter-spacing:-.045em;margin-top:4px;line-height:1.1;overflow-wrap:anywhere}
.ledger-head .s{font-size:12.5px;color:var(--ink-dim);margin-top:4px}
@media (max-width:560px){ .ledger-head .v{font-size:27px} }

/* small figures sit in a ruled strip, divided by hairlines */
.tile{flex:1 1 150px;min-width:0;padding:11px 0;border-right:1px solid var(--rule)}
.tile:last-child{border-right:0}
.tile+.tile{padding-left:14px}
.tile .k{font-size:9.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mute)}
.tile .v{font-family:var(--f-num);font-size:17px;font-weight:500;margin-top:3px;letter-spacing:-.035em;overflow-wrap:anywhere}
.tile .s{font-size:11px;color:var(--ink-mute);margin-top:2px}
.tile.hero{flex-basis:100%;border-right:0;padding-bottom:14px}
.tile.hero .v{font-size:30px}
/* On a phone the strip becomes two even columns: the vertical rules would leave
   a stranded indent on whichever figure wraps to its own row. */
@media (max-width:560px){
  .g3,.g4{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;border-bottom:1px solid var(--rule)}
  .tile{flex:none;border-right:0}
  .tile+.tile{padding-left:0}
  .tile .v{font-size:15.5px}
  .tile.hero .v{font-size:25px}
  .sync span{display:none}   /* keep the dot, give the title its room back */
}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--ink-dim);white-space:nowrap;padding:0}
.pill::before{content:"";width:6px;height:6px;background:currentColor;flex:0 0 auto}
.pill.pos{color:var(--pos)} .pill.neg{color:var(--neg)} .pill.warn{color:var(--warn)} .pill.xf{color:var(--xfer)}

/* ───────── the register ───────── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:9.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mute);padding:9px 10px 7px;border-bottom:1px solid var(--rule);white-space:nowrap;background:transparent}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
td{padding:9px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tfoot th{border-top:1px solid var(--ink);border-bottom:0;color:var(--ink);font-size:12px;letter-spacing:0;text-transform:none}
td.r,th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
th.r{font-family:var(--f-ui)}
tbody tr:hover{background:var(--paper-2)}
tbody tr.clickable{cursor:pointer}
.t-main{font-weight:500}
.t-sub{font-size:11.5px;color:var(--ink-mute);margin-top:1px}
.cl-dot{display:inline-block;width:5px;height:5px;background:var(--pos);vertical-align:middle}

.ledger-row{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule-soft);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.ledger-row:last-child{border-bottom:0}
.ledger-row:hover .t-main{text-decoration:underline;text-underline-offset:2px}
.ledger-mid{flex:1;min-width:0}
.ledger-amt{text-align:right;flex:0 0 auto;font-weight:500}
.daymark{display:flex;gap:10px;align-items:baseline;padding:16px 0 5px;border-bottom:1px solid var(--rule)}
.daymark b{flex:1;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute)}

/* ───────── budget bars: a measured line, not a pill ───────── */
.bar{height:6px;background:var(--paper-3);margin-top:7px;position:relative}
.bar>i{display:block;height:100%;background:var(--ink)}
.bar>i.over{background:var(--neg)}
.bar>i.near{background:var(--warn)}
.brow{padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.brow:last-child{border-bottom:0}
.brow-t{display:flex;gap:10px;align-items:baseline}
.brow-t .n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ranked bars stand in for the pie — easier to read, and it belongs here */
.rank{display:flex;flex-direction:column}
.rank-row{padding:10px 0;border-bottom:1px solid var(--rule-soft);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rank-row:last-child{border-bottom:0}
.rank-t{display:flex;gap:10px;align-items:baseline}
.rank-t .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-t .p{font-family:var(--f-num);font-size:11.5px;color:var(--ink-mute);width:34px;text-align:right}
.rank-t .a{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.rank-bar{height:4px;background:var(--paper-3);margin-top:6px}
.rank-bar i{display:block;height:100%;background:var(--ink)}

/* ───────── forms ───────── */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:10px;font-weight:600;color:var(--ink-mute);letter-spacing:.14em;text-transform:uppercase}
.inp{width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--rule);background:transparent;min-width:0;border-radius:0}
select.inp{padding-right:18px}
.inp:focus{outline:0;border-bottom:1px solid var(--ink)}
textarea.inp{min-height:58px;resize:vertical;border:1px solid var(--rule);padding:8px 10px}
.amt-inp{font-family:var(--f-num);font-size:32px;font-weight:500;text-align:right;padding:2px 0;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:none;width:100%;letter-spacing:-.045em}
.amt-inp:focus{outline:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:14px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px}
.chk input{width:16px;height:16px;accent-color:var(--ink);flex:0 0 auto}
.hint{font-size:11.5px;color:var(--ink-mute);line-height:1.5}

/* ───────── sheets ───────── */
#scrim{position:fixed;inset:0;background:rgba(20,18,12,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--paper);display:flex;flex-direction:column;border-top:2px solid var(--ink);
  left:0;right:0;bottom:0;top:auto;max-height:92%;transform:translateY(102%);transition:transform .2s cubic-bezier(.3,.8,.3,1)}
.sheet.on{transform:translateY(0)}
.sheet-h{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.sheet-h h2{font-family:var(--f-display);font-size:17px;font-weight:500;flex:1;min-width:0}
.sheet-b{flex:1;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 18px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-f{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--ink);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-f .btn{flex:1;padding-block:9px}
@media (min-width:720px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-48%);width:min(540px,94vw);max-height:88%;
    border:1px solid var(--ink);opacity:0;transition:transform .18s,opacity .18s;box-shadow:0 30px 60px -40px rgba(0,0,0,.6)}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:60;background:var(--ink);color:var(--paper);padding:9px 16px;font-size:13.5px;opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){#toast{bottom:24px}}

/* ───────── pickers, chips, lists ───────── */
.plist{display:flex;flex-direction:column;max-height:46vh;overflow:auto}
.pitem{display:flex;align-items:baseline;gap:10px;padding:9px 0;border:0;border-bottom:1px solid var(--rule-soft);background:none;text-align:left;width:100%}
.pitem:hover .nm{text-decoration:underline;text-underline-offset:2px}
.pitem[aria-pressed="true"]{font-weight:600}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem.sub{padding-left:18px;font-size:13.5px;color:var(--ink-dim)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--rule);background:transparent;font-size:12.5px;border-radius:2px;color:var(--ink-dim)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.chip .x{font-weight:600}
.scroll-x{overflow-x:auto;display:flex;gap:7px;padding:12px 0 2px}

.empty{text-align:center;padding:34px 16px;color:var(--ink-mute)}
.empty b{display:block;font-family:var(--f-display);font-size:16px;font-weight:500;color:var(--ink-dim)}
.empty p{margin:5px 0 0;font-size:13px}
.empty .big{display:none}
.split-row{display:grid;grid-template-columns:1fr 100px 28px;gap:10px;align-items:center}
.legend{display:flex;flex-direction:column}
.lg-row{display:flex;align-items:baseline;gap:9px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--rule-soft)}
.lg-sw{width:8px;height:8px;flex:0 0 auto;align-self:center}
.lg-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.chart{display:block;width:100%;height:auto;max-width:100%}

#signin{position:fixed;inset:0;z-index:85;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.signin-box{max-width:360px;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:14px;border-top:1px solid var(--ink);padding-top:22px}
.signin-box h2{font-family:var(--f-display);font-size:25px;font-weight:600;letter-spacing:.01em}
.signin-box p{margin:0;font-size:13.5px;color:var(--ink-dim);line-height:1.6}

  async pullAndMerge(preferLocal) {

  watchAll(onDoc, onError) {

      try {

        this.remoteTag = tag;
        Object.keys(remote).forEach(k => onDoc(k, remote[k]));
      } catch (e) { if (onError) onError(e); }
    };
    clearInterval(this.pollTimer);
    this.pollTimer = setInterval(tick, 45000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  },
  async wipe() { this.cache = {}; await this.save(); }
};

  const tplPairs = [["อาหารและเครื่องดื่ม", 4000], ["ของชำ/ซูเปอร์", 5000], ["เดินทาง", 3000], ["บ้าน/ค่าเช่า", 9500],

function removeDemo() {

  S.recurring = S.recurring.filter(r => !r.demo);

    Object.keys(seed.tpl || {}).forEach(id => { if (S.budgets.tpl[id] === seed.tpl[id]) S.budgets.tpl[id] = null; });
    (seed.roll || []).forEach(id => { S.budgets.roll[id] = false; });
    const stillUsed = {};
    allTx().forEach(x => { if (x.payee) stillUsed[x.payee] = 1; });
    S.payees = S.payees.filter(p => {
      const keep = !(seed.payees || []).includes(p.name) || stillUsed[p.name];
      if (!keep) markDeleted("payees", p.id);

/* ------------- boot ------------- */
function hasAnyData() { return S.accounts.length > 0; }

async function boot() {
  LANG = (navigator.language || "th").slice(0, 2) === "th" ? "th" : "th";
  loadLocal();                       // anonymous cache, if any
  if (S.settings.lang) LANG = S.settings.lang;
  applyTheme();
  if (!hasAnyData()) { seedBase(); seedDemo(); }
  UI.booted = true;
  render();
  if (S.settings.pin) showLock("unlock");

  // whichever store this visitor can actually reach
  const conn = await chooseBackend();
  if (!conn) {
    setStatus("local"); postDueRecurring(); persistAll(); render();
    if (canSignInWithGoogle()) showSignIn();
    return;
  }
  Sync.id = conn.id; Sync.label = conn.label || "";

  // local cache is keyed by viewer id; re-read under the real key
  const anonSnapshot = JSON.parse(JSON.stringify({ s: S.settings, a: S.accounts, c: S.categories, p: S.payees, r: S.recurring, b: S.budgets, i: S.index, t: S.tx }));
  S.accounts = []; S.categories = []; S.payees = []; S.recurring = []; S.tx = {}; S.index = { months: {} };
  loadLocal();
  Sync.dirty = lsGet("_dirty") || {};   // writes from an earlier visit that never reached the store
  setStatus("syncing");

  let remote = {};
  try {
    const bodies = await Promise.all(CORE_KEYS.map(k => Backend.getDoc(k)));
    CORE_KEYS.forEach((k, i) => { if (bodies[i]) remote[k] = bodies[i]; });
  } catch (e) { setStatus("err"); }

  if (remote.accounts && (remote.accounts.items || []).length) {
    CORE_KEYS.forEach(k => { if (remote[k]) { applyBody(k, remote[k]); lsSet(k, remote[k]); } });
    await fetchMonths(Object.keys(S.index.months));
  } else if (S.accounts.length) {
    await persistAll();                        // this device had data; push it up
  } else {
    S.settings = anonSnapshot.s; S.accounts = anonSnapshot.a; S.categories = anonSnapshot.c;
    S.payees = anonSnapshot.p; S.recurring = anonSnapshot.r; S.budgets = anonSnapshot.b;
    S.index = anonSnapshot.i; S.tx = anonSnapshot.t;
    invalidate();
    await persistAll();
  }
  if (S.settings.lang) LANG = S.settings.lang;
  applyTheme();
  setStatus("ok");
  postDueRecurring();
  render();
  // a device with no local copy only learns about the PIN once the settings arrive
  if (S.settings.pin && !UI.unlocked && $("#lock").classList.contains("hide")) showLock("unlock");
  watchRemote();
  flushDirty();
}

async function fetchMonths(keys) {
  // a month the index no longer lists was emptied on another device
  Object.keys(S.tx).forEach(mk => {
    if (!(mk in S.index.months)) { delete S.tx[mk]; delete Sync.revs[mk]; lsDel("m_" + mk); invalidate(); }
  });
  const want = keys.filter(mk => (Number(S.index.months[mk]) || 0) !== (Number(Sync.revs[mk]) || 0) || !S.tx[mk]);
  if (!want.length) return;
  const chunk = 12;
  for (let i = 0; i < want.length; i += chunk) {
    const part = want.slice(i, i + chunk);
    try {
      const bodies = await Promise.all(part.map(mk => Backend.getDoc("m_" + mk)));
      bodies.forEach((b, j) => {
        const mk = part[j];
        if (b) { applyBody("m_" + mk, b); lsSet("m_" + mk, b); }
        // A month listed in the index with no document (erased elsewhere) is
        // still "fetched" -- otherwise every index change retries it forever.
        else { S.tx[mk] = S.tx[mk] || []; Sync.revs[mk] = S.index.months[mk] || 1; }
      });
    } catch (e) { setStatus("err"); break; }
  }
  invalidate();
}

function watchRemote() {
  Backend.watchAll((k, body) => {
    if (!body) return;
    if (JSON.stringify(body) === JSON.stringify(docBody(k))) return;
    applyBody(k, body); lsSet(k, body);
    if (k === "settings") { LANG = S.settings.lang || LANG; applyTheme(); }
    if (k === "index") fetchMonths(Object.keys(S.index.months)).then(render);
    render();
  }, () => setStatus("err"));
}

   ใน sessionStorage อยู่แล้ว การ boot รอบถัดไปจึงต่อ Drive ได้เองตั้งแต่ต้น */
async function signInWithGoogle() {
  const r = await driveBackend.signIn();
  if (!r) { toast(LANG === "th" ? "เข้าสู่ระบบไม่สำเร็จ" : "Sign-in did not complete"); return false; }

}

/* ------------- recurring ------------- */
function postRecurring(rec, dateOverride) {
  const date = dateOverride || rec.next;
  const x = Object.assign({}, rec.tx, {
    // Two devices opening on the same day both post this entry. A deterministic id
    // makes them the same row, so the merge keeps one instead of charging twice.
    id: "rec-" + rec.id + "-" + date, date, tags: (rec.tx.tags || []).slice(), createdAt: Date.now(), updatedAt: Date.now(),
    splits: rec.tx.splits ? rec.tx.splits.map(s => Object.assign({}, s)) : null,
    recurringId: rec.id
  });
  const mk = mkey(date);
  (S.tx[mk] = S.tx[mk] || []).push(x);
  invalidate();
  return { tx: x, mk };
}
function advanceRecurring(rec) {
  rec.next = advance(rec.next, rec.freq, rec.every, rec.anchorDay);
  if (rec.end && rec.next > rec.end) { S.recurring = S.recurring.filter(r => r.id !== rec.id); return false; }
  return true;
}
function postDueRecurring() {
  const today = todayISO(); const touched = {}; let n = 0;
  S.recurring.slice().forEach(rec => {
    if (!rec.auto) return;
    let guard = 0;
    while (rec.next && rec.next <= today && guard++ < 60) {
      const id = "rec-" + rec.id + "-" + rec.next;
      const already = (S.tx[mkey(rec.next)] || []).some(x => x.id === id);
      if (!already) { const r = postRecurring(rec); touched[r.mk] = 1; n++; }
      if (!advanceRecurring(rec)) break;
    }
  });
  if (n) {
    Object.keys(touched).forEach(mk => persistMonth(mk));
    persist("recurring");
    toast((LANG === "th" ? "ลงรายการประจำให้แล้ว " : "Posted ") + n + (LANG === "th" ? " รายการ" : " scheduled entries"));
  }
}

    '<span class="ledger-mid"><span class="t-main" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(title) + "</span>" +
    '<span class="t-sub" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(sub) + "</span></span>" +
    '<span class="ledger-amt num ' + amtCls + '">' + esc(sign + fmt(x.amount, a ? a.currency : null).replace("-", "")) +
    (o.showDate ? '<span class="t-sub" style="display:block;font-weight:400">' + esc(dateLabel(x.date)) + "</span>" : "") +
    (x.cleared && !o.showDate ? '<span class="t-sub" style="display:block;font-weight:400">' + esc(t("cleared")) + "</span>" : "") +
    "</span></button>";
}

/* ---------- PIN lock ---------- */
async function sha(s) {
  if (!window.crypto || !crypto.subtle) return "plain:" + s;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("bahtbook|" + s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function renderKeypad() {
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"];
  $("#keypad").innerHTML = keys.map(k => k ? '<button data-key="' + esc(k) + '">' + (k === "⌫" ? "⌫" : k) + "</button>" : "<span></span>").join("");
}
function paintDots(n) { $$("#pin-dots i").forEach((d, i) => d.classList.toggle("f", i < n)); }
function showLock(mode) {
  UI.pinState = { mode: mode, buf: "", first: null };
  $("#lock").classList.remove("hide");
  $("#lock-title").textContent = mode === "unlock" ? t("enterPin") : t("newPin");
  $("#lock-sub").textContent = mode === "unlock" ? (LANG === "th" ? "ปลดล็อกเพื่อดูข้อมูลการเงิน" : "Unlock to see your finances") : (LANG === "th" ? "จำรหัสนี้ไว้ให้ดี" : "Remember this code");
  $("#pin-forgot").classList.toggle("hide", mode !== "unlock");
  renderKeypad(); paintDots(0);
}
function hideLock() { $("#lock").classList.add("hide"); UI.pinState = null; UI.unlocked = true; }
async function pinKey(k) {
  const st = UI.pinState; if (!st) return;
  if (k === "⌫") { st.buf = st.buf.slice(0, -1); paintDots(st.buf.length); return; }
  if (st.buf.length >= 4) return;
  st.buf += k; paintDots(st.buf.length);
  if (st.buf.length < 4) return;
  const code = st.buf; st.buf = "";
  if (st.mode === "unlock") {
    const h = await sha(code);
    if (h === S.settings.pin) { hideLock(); }
    else { paintDots(0); $("#lock-sub").textContent = t("pinWrong"); navigator.vibrate && navigator.vibrate(120); }
    return;
  }
  if (st.first == null) { st.first = code; paintDots(0); $("#lock-title").textContent = t("confirmPin"); $("#lock-sub").textContent = ""; return; }
  if (st.first !== code) { st.first = null; paintDots(0); $("#lock-title").textContent = t("newPin"); $("#lock-sub").textContent = t("pinWrong"); return; }
  S.settings.pin = await sha(code);
  persist("settings"); hideLock(); render(); toast(t("pinSet"));
}
</script>
<script>
"use strict";
/* ============================ charts ============================ */

function chartGroupedBars(rows, opt) {
  const o = opt || {}, W = 660, H = 210, L = 52, R = 6, T = 10, B = 26;
  const iw = W - L - R, ih = H - T - B;
  const max = Math.max(1, ...rows.map(r => Math.max(r.a || 0, r.b || 0)));
  const step = iw / Math.max(1, rows.length);
  const bw = Math.min(16, step / 3.1);
  const y = v => T + ih - (v / max) * ih;
  let g = "";
  for (let i = 0; i <= 2; i++) {
    const v = (max / 2) * i, yy = y(v);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="var(--rule)" stroke-width="1"/>';
    g += '<text x="' + (L - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="var(--ink-mute)" font-family="var(--f-num)">' + esc(fmtShort(v)) + "</text>";
  }
  let bars = "";
  rows.forEach((r, i) => {
    const cx = L + step * i + step / 2;
    const ya = y(r.a || 0), yb = y(r.b || 0);
    bars += '<rect x="' + (cx - bw - 1.5).toFixed(1) + '" y="' + ya.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, T + ih - ya).toFixed(1) + '" fill="var(--pos)"/>';
    bars += '<rect x="' + (cx + 1.5).toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, T + ih - yb).toFixed(1) + '" fill="var(--neg)"/>';
    bars += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-mute)">' + esc(r.label) + "</text>";
  });
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("incomeVsExpense")) + '">' + g + bars +
    '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ih) + '" y2="' + (T + ih) + '" stroke="var(--rule)" stroke-width="1.4"/></svg>';
}
function chartLine(pts) {
  const W = 660, H = 190, L = 52, R = 8, T = 12, B = 24;
  const iw = W - L - R, ih = H - T - B;
  if (!pts.length) return "";
  const vals = pts.map(p => p.v);
  let min = Math.min(0, ...vals), max = Math.max(1, ...vals);
  if (max === min) max = min + 1;
  const x = i => L + (pts.length === 1 ? iw / 2 : (iw * i) / (pts.length - 1));
  const y = v => T + ih - ((v - min) / (max - min)) * ih;
  let g = "";
  for (let i = 0; i <= 2; i++) {
    const v = min + ((max - min) / 2) * i, yy = y(v);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="var(--rule)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="var(--ink-mute)" font-family="var(--f-num)">' + esc(fmtShort(v)) + "</text>";
  }
  const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = d + " L" + x(pts.length - 1).toFixed(1) + " " + (T + ih) + " L" + x(0).toFixed(1) + " " + (T + ih) + " Z";
  let lab = "";
  pts.forEach((p, i) => { if (pts.length <= 8 || i % Math.ceil(pts.length / 7) === 0 || i === pts.length - 1) lab += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-mute)">' + esc(p.label) + "</text>"; });
  const last = pts[pts.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("netWorthTrend")) + '">' + g +
    '<path d="' + area + '" fill="var(--paper-3)" stroke="none"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>' +
    '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(last.v).toFixed(1) + '" r="4" fill="var(--ink)"/>' + lab + "</svg>";
}

/* A ranked list of bars in place of a pie: it reads top to bottom like the rest
   of the ledger, the figures stay legible, and it needs no colour key. */
function rankedBars(items, opt) {
  const o = opt || {};
  const total = items.reduce((s, i) => s + i.value, 0) || 1;
  const max = items.length ? Math.max.apply(null, items.map(i => i.value)) : 1;
  return '<div class="rank">' + items.map(it => {
    const tag = o.clickable ? 'button class="rank-row" data-rep-cat="' + esc(it.id) + '"' : 'div class="rank-row"';
    return "<" + tag + ">" +
      '<div class="rank-t"><span class="n">' + esc(it.name) + "</span>" +
      '<span class="p">' + Math.round((it.value / total) * 100) + "%</span>" +
      '<span class="a">' + esc(fmt(it.value)) + "</span></div>" +
      '<div class="rank-bar"><i style="width:' + Math.max(1, Math.round((it.value / max) * 100)) + '%"></i></div>' +
      "</" + (o.clickable ? "button" : "div") + ">";
  }).join("") + "</div>";
}

/* ============================ overview ============================ */
RENDERERS.overview = function () {
  const mk = UI.month, from = monthStart(mk), to = monthEnd(mk);
  const list = txInRange(from, to), tt = totals(list), nw = netWorth(), b = balances();
  const days = daysInMonth(mk);
  const isCur = mk === mkey(todayISO());
  const dayNow = isCur ? new Date().getDate() : days;
  const proj = dayNow ? r2((tt.expense / dayNow) * days) : 0;
  const rate = tt.income > 0 ? Math.round(((tt.income - tt.expense) / tt.income) * 100) : null;

  let h = localModeBanner() + demoBanner() + rateWarning();
  // the headline figure, then a double rule, then the month's three figures in a ruled strip
  h += '<div class="ledger-head"><div class="k">' + esc(t("netWorth")) + "</div>" +
    '<div class="v' + (nw.total < 0 ? " neg" : "") + '">' + esc(fmt(nw.total)) + "</div>" +
    '<div class="s num">' + esc(t("assets")) + " " + esc(fmtShort(nw.assets)) + " · " + esc(t("liabilities")) + " " + esc(fmtShort(nw.liabilities)) + "</div></div>";
  h += '<div class="g4">' +
    '<div class="tile"><div class="k">' + esc(t("income")) + '</div><div class="v pos">' + esc(fmt(tt.income)) + '</div><div class="s">' + esc(monthLabel(mk)) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("expense")) + '</div><div class="v neg">' + esc(fmt(tt.expense)) + '</div><div class="s">' + esc(t("projected")) + " " + esc(fmtShort(proj)) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("net")) + '</div><div class="v ' + (tt.net < 0 ? "neg" : "pos") + '">' + esc(fmt(tt.net, null, { signed: true })) + "</div>" +
      '<div class="s">' + (rate == null ? "—" : esc(t("savingsRate")) + " " + rate + "%") + "</div></div></div>";

  /* last 6 months bars */
  const rows = [];
  for (let i = 5; i >= 0; i--) { const k = addMonthKey(mk, -i); const x = totals(txInRange(monthStart(k), monthEnd(k))); rows.push({ label: monthLabel(k, false), a: x.income, b: x.expense }); }
  h += '<div class="grid g2 sec">' +
    '<div class="card"><div class="card-h"><h2>' + esc(t("incomeVsExpense")) + '</h2><span class="pill pos">' + esc(t("income")) + '</span><span class="pill neg">' + esc(t("expense")) + "</span></div>" +
    '<div class="card-b">' + chartGroupedBars(rows) + "</div></div>";

  /* category donut */
  const spent = sumByCat(list, "expense");
  const agg = {};
  Object.keys(spent).forEach(cid => { const c = catById(cid); const top = c && c.parent ? c.parent : cid; agg[top] = r2((agg[top] || 0) + spent[cid]); });
  const items = Object.keys(agg).map(id => ({ id, name: id === "_none" ? t("uncategorized") : catFull(id), value: agg[id] })).sort((a, b2) => b2.value - a.value);
  const top = items.slice(0, 7);
  if (items.length > 7) top.push({ id: "_rest", name: LANG === "th" ? "อื่นๆ" : "Other", value: r2(items.slice(7).reduce((s, i) => s + i.value, 0)) });
  h += '<div class="card"><div class="card-h"><h2>' + esc(t("byCategory")) + '</h2><button class="btn g sm" data-go="reports">' + esc(LANG === "th" ? "รายงาน" : "Reports") + "</button></div><div class=\"card-b\">" +
    (top.length ? rankedBars(top) : emptyState(t("noTx"))) + "</div></div></div>";

  /* budget snapshot */
  const brs = budgetRows(mk).filter(r => r.budget > 0);
  if (brs.length) {
    const tb = r2(brs.reduce((s, r) => s + r.budget, 0)), ts = r2(brs.reduce((s, r) => s + r.spent, 0));
    const sorted = brs.slice().sort((a, b2) => b2.spent / (b2.budget || 1) - a.spent / (a.budget || 1)).slice(0, 5);
    h += '<div class="card sec"><div class="card-h"><h2>' + esc(t("budget")) + " · " + esc(monthLabel(mk)) + '</h2><span class="num dim" style="font-size:12.5px">' + esc(fmt(ts)) + " / " + esc(fmt(tb)) + '</span><button class="btn g sm" data-go="budget">' + IC.chev + "</button></div><div class=\"card-b\">" +
      sorted.map(r => budgetRowHTML(r, mk)).join("") + "</div></div>";
  }

  /* upcoming */
  const up = S.recurring.slice().filter(r => r.next).sort((a, b2) => (a.next < b2.next ? -1 : 1)).slice(0, 4);
  if (up.length) {
    h += '<div class="card sec"><div class="card-h"><h2>' + esc(t("upcoming")) + '</h2><button class="btn g sm" data-act="rec-manage">' + esc(t("recurring")) + "</button></div><div class=\"card-b\">" +
      up.map(r => {
        const a = accById(r.tx.acct);
        return '<div class="srow"><span class="l"><b>' + esc(LANG === "en" && r.en ? r.en : r.name) + "</b><span>" + esc(dateLabel(r.next)) + " · " + esc(a ? acctName(a) : "") + '</span></span><span class="num ' + (r.tx.type === "income" ? "pos" : "neg") + '">' + esc(fmt(r.tx.amount, a ? a.currency : null)) + '</span><button class="btn sm" data-post-rec="' + esc(r.id) + '">' + esc(t("postNow")) + "</button></div>";
      }).join("") + "</div></div>";
  }

  /* recent */
  const recent = list.slice(0, 12);
  h += '<div class="card sec"><div class="card-h"><h2>' + esc(t("recent")) + '</h2><button class="btn g sm" data-go="register">' + esc(t("all")) + "</button></div><div class=\"card-b\">" +
    (recent.length ? recent.map(x => txRowHTML(x, { showDate: true })).join("") : emptyState(t("noTx"), t("noTxSub"), "🧾")) + "</div></div>";
  return h;
};

function budgetRowHTML(r, mk) {

  return '<div class="brow"><div class="brow-t"><span class="n">' + esc(r.cat.id === "_none" ? r.cat.name : catName(r.cat)) + "</span>" +
    (r.budget ? '<span class="num dim" style="font-size:12.5px">' + esc(fmt(r.spent, null, { compact: true })) + " / " + esc(fmt(r.budget, null, { compact: true })) + "</span>" +
      '<span class="pill ' + (left < 0 ? "neg" : pct > 85 ? "warn" : "pos") + '">' + (left < 0 ? esc(t("over")) + " " + esc(fmtShort(-left)) : esc(fmtShort(left))) + "</span>"

}

RENDERERS.accounts = function () {

/* ============================ register ============================ */
function regFiltered() {
  const f = UI.reg;
  const q = (f.q || "").trim().toLowerCase();
  return allTx().filter(x => {
    if (f.acct && x.acct !== f.acct && x.to !== f.acct) return false;
    if (f.type && x.type !== f.type) return false;
    if (f.from && x.date < f.from) return false;
    if (f.to && x.date > f.to) return false;
    if (f.uncleared && x.cleared) return false;
    if (f.cat) { const ids = [f.cat].concat(S.categories.filter(c => c.parent === f.cat).map(c => c.id)); if (!txLines(x).some(l => ids.indexOf(l.cat) >= 0)) return false; }
    if (q) {
      const hay = [x.payee, x.note, catFull(x.cat), (x.tags || []).join(" "), String(x.amount), (x.splits || []).map(s => (s.note || "") + " " + catFull(s.cat)).join(" ")].join(" ").toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
RENDERERS.register = function () {
  const f = UI.reg;
  const list = regFiltered();
  const tt = totals(list);
  const single = f.acct ? accById(f.acct) : null;

  let chips = '<button class="chip" data-reg-acct="" ' + (!f.acct ? 'aria-pressed="true"' : "") + ">" + esc(t("all")) + "</button>" +
    S.accounts.filter(a => !a.archived).map(a => '<button class="chip" data-reg-acct="' + esc(a.id) + '"' + (f.acct === a.id ? ' aria-pressed="true"' : "") + "><span style=\"width:6px;height:6px;background:" + esc(a.color || "#888") + ';display:inline-block"></span>' + esc(acctName(a)) + "</button>").join("");

  const active = [];
  if (f.q) active.push({ k: "q", label: '"' + f.q + '"' });
  if (f.type) active.push({ k: "type", label: t(f.type) });
  if (f.cat) active.push({ k: "cat", label: catFull(f.cat) });
  if (f.from || f.to) active.push({ k: "date", label: (f.from || "…") + " → " + (f.to || "…") });
  if (f.uncleared) active.push({ k: "uncleared", label: t("unclearedOnly") });
  if (active.length) h += '<div class="chips sec">' + active.map(a => '<button class="chip" data-reg-clear="' + a.k + '">' + esc(a.label) + ' <span class="x">×</span></button>').join("") +
    '<button class="chip" data-reg-clear="all">' + esc(t("clear")) + "</button></div>";

  h += '<div class="g4">' +
    '<div class="tile"><div class="k">' + esc(t("count")) + '</div><div class="v num">' + list.length + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("income")) + '</div><div class="v num pos">' + esc(fmt(tt.income)) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("expense")) + '</div><div class="v num neg">' + esc(fmt(tt.expense)) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(single ? t("balance") : t("net")) + '</div><div class="v num ' + ((single ? balances()[single.id] : tt.net) < 0 ? "neg" : "pos") + '">' +
      esc(single ? fmt(balances()[single.id] || 0, single.currency) : fmt(tt.net, null, { signed: true })) + "</div></div></div>";

  if (!list.length) return h + '<div class="card"><div class="card-b">' + emptyState(t("noTx"), t("noTxSub"), "🧾") + "</div></div>";

  /* running balance for a single account, computed oldest-first */
  let run = null;
  if (single) {
    run = {};
    const mine = allTx().filter(x => x.acct === single.id || x.to === single.id).slice().reverse();
    let bal = Number(single.opening) || 0;
    mine.forEach(x => {
      if (x.type === "transfer") { if (x.acct === single.id) bal -= Number(x.amount) || 0; if (x.to === single.id) bal += Number(x.toAmount) || Number(x.amount) || 0; }
      else if (x.type === "income") bal += Number(x.amount) || 0;
      else bal -= Number(x.amount) || 0;
      run[x.id] = r2(bal);
    });
  }
  const cap = UI.reg.limit || 150;
  const shown = list.slice(0, cap);
  let body = "", lastDate = null;
  shown.forEach(x => {
    if (x.date !== lastDate) {
      lastDate = x.date;
      const dayTot = totals(list.filter(y => y.date === x.date));
      body += '<div class="daymark"><b>' + esc(dateLabel(x.date)) + "</b>" +
        (dayTot.expense ? '<span class="num neg" style="font-size:12px">-' + esc(fmt(dayTot.expense).replace("-", "")) + "</span>" : "") +
        (dayTot.income ? '<span class="num pos" style="font-size:12px">+' + esc(fmt(dayTot.income)) + "</span>" : "") + "</div>";
    }
    let row = txRowHTML(x);
    if (run) row = row.replace("</span></button>", '<span class="t-sub num" style="display:block;font-weight:400">' + esc(fmt(run[x.id] || 0, single.currency)) + "</span></span></button>");
    body += row;
  });
  h += '<div class="card"><div class="card-b" style="padding-top:4px">' + body +
    (list.length > cap ? '<div style="display:flex;justify-content:center;padding-top:12px"><button class="btn" data-act="reg-more">' + esc(LANG === "th" ? "แสดงเพิ่ม" : "Show more") + " (" + (list.length - cap) + ")</button></div>" : "") +
    "</div></div>";
  return h;
};
</script>
<script>
"use strict";
/* ============================ budget ============================ */
RENDERERS.budget = function () {
  const mk = UI.month;
  const rows = budgetRows(mk);
  const budgeted = r2(rows.reduce((s, r) => s + r.budget, 0));
  const spent = r2(rows.reduce((s, r) => s + r.spent, 0));
  const left = r2(budgeted - spent);
  const days = daysInMonth(mk);
  const isCur = mk === mkey(todayISO());
  const dleft = isCur ? Math.max(1, days - new Date().getDate() + 1) : days;
  const income = totals(txInRange(monthStart(mk), monthEnd(mk))).income;

  let h = '<div class="ledger-head"><div class="k">' + esc(t("totalBudget")) + '</div><div class="v">' + esc(fmt(budgeted)) + '</div><div class="s">' + esc(monthLabel(mk)) + "</div></div>" +
    '<div class="g4">' +
    '<div class="tile"><div class="k">' + esc(t("spent")) + '</div><div class="v num neg">' + esc(fmt(spent)) + '</div><div class="s">' + (budgeted ? Math.round((spent / budgeted) * 100) + "%" : "—") + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("left")) + '</div><div class="v num ' + (left < 0 ? "neg" : "pos") + '">' + esc(fmt(left)) + "</div>" +
      '<div class="s num">' + esc(fmtShort(left > 0 ? left / dleft : 0)) + " " + esc(t("perDay")) + " · " + dleft + " " + esc(t("day")) + " " + esc(t("daysLeft")) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("income")) + '</div><div class="v num pos">' + esc(fmt(income)) + "</div>" +
      '<div class="s">' + (income > 0 ? esc(LANG === "th" ? "ตั้งงบไว้ " : "Budgeted ") + Math.round((budgeted / income) * 100) + "%" : "—") + "</div></div></div>";

  h += '<div class="sec-h"><h2>' + esc(t("byCategory")) + '</h2><button class="btn sm" data-act="copy-last">' + IC.copy + " " + esc(t("copyLast")) + "</button></div>";
  h += '<div class="card"><div class="card-b">';
  const budgetedRows = rows.filter(r => r.budget > 0 || r.spent > 0);
  const restRows = rows.filter(r => !r.budget && !r.spent);
  h += budgetedRows.map(r => {
    let s = '<div data-budget-cat="' + esc(r.cat.id) + '" style="cursor:pointer">' + budgetRowHTML(r, mk);
    if (r.kids.length) s += '<div style="padding-left:24px">' + r.kids.map(k => {
      const pct = k.budget ? Math.round((k.spent / k.budget) * 100) : null;
      return '<div class="brow" data-budget-cat="' + esc(k.cat.id) + '" style="cursor:pointer"><div class="brow-t"><span class="n" style="font-size:13px">' + esc(catName(k.cat)) + '</span><span class="num dim" style="font-size:12px">' + esc(fmt(k.spent, null, { compact: true })) + (k.budget ? " / " + esc(fmt(k.budget, null, { compact: true })) : "") + "</span></div>" +
        (k.budget ? '<div class="bar" style="height:5px"><i class="' + (pct > 100 ? "over" : pct > 85 ? "near" : "") + '" style="width:' + clamp(pct, 0, 100) + '%"></i></div>' : "") + "</div>";
    }).join("") + "</div>";
    return s + "</div>";
  }).join("");
  h += "</div></div>";

  if (restRows.length) {
    h += '<div class="sec-h" style="margin-top:16px"><h2 style="font-size:13.5px;color:var(--ink-dim)">' + esc(t("noBudget")) + "</h2></div>" +
      '<div class="card"><div class="card-b"><div class="chips">' +
      restRows.map(r => '<button class="chip" data-budget-cat="' + esc(r.cat.id) + '">' + esc(catName(r.cat)) + " +</button>").join("") + "</div></div></div>";
  }
  return h;
};

function budgetSheet(catId) {
  const c = catById(catId); if (!c) return;
  const mk = UI.month;
  const cur = budgetFor(catId, mk);
  const perMonth = S.budgets.m[mk] && S.budgets.m[mk][catId] != null;
  openSheet({
    title: catName(c),
    body:
      '<div class="field"><label>' + esc(t("setBudget")) + " · " + esc(monthLabel(mk)) + '</label><input class="amt-inp" id="bg-amt" inputmode="decimal" data-autofocus value="' + (cur ? cur : "") + '" placeholder="0"></div>' +
      '<label class="chk"><input type="checkbox" id="bg-only"' + (perMonth ? " checked" : "") + "><span>" + esc(LANG === "th" ? "ใช้กับเดือนนี้เท่านั้น (ไม่เปลี่ยนงบประจำ)" : "This month only (keep the monthly default)") + "</span></label>" +
      '<label class="chk"><input type="checkbox" id="bg-roll"' + (S.budgets.roll[catId] ? " checked" : "") + "><span>" + esc(t("rollover")) + "</span></label>" +
      '<p class="hint" style="margin:0">' + esc(LANG === "th"
        ? "ใส่ 0 เพื่อเลิกตั้งงบ ถ้าติ๊ก “ใช้กับเดือนนี้เท่านั้น” การใส่ 0 แปลว่าเดือนนี้ไม่มีงบ และเอาติ๊กออกเพื่อกลับไปใช้งบประจำ"
        : "Enter 0 to remove the budget. With “this month only” ticked, 0 means no budget this month; untick it to go back to the monthly default.") + "</p>",
    onOk: () => {
      const v = parseAmount($("#bg-amt").value) || 0;
      const only = $("#bg-only").checked;
      const roll = $("#bg-roll").checked;
      // null rather than delete: a removal has to be a value, so it survives a merge
      if (only) { S.budgets.m[mk] = S.budgets.m[mk] || {}; S.budgets.m[mk][catId] = v; }
      else { S.budgets.tpl[catId] = v || null; if (S.budgets.m[mk]) S.budgets.m[mk][catId] = null; }
      S.budgets.roll[catId] = !!roll;
      persist("budgets"); closeSheet(); render(); toast(t("saved"));
    }
  });
}
function copyLastMonth() {
  const prev = addMonthKey(UI.month, -1);
  const src = {};
  S.categories.forEach(c => { const v = budgetFor(c.id, prev); if (v) src[c.id] = v; });
  if (!Object.keys(src).length) { toast(LANG === "th" ? "เดือนก่อนไม่มีงบ" : "No budget last month"); return; }
  Object.keys(S.budgets.m[UI.month] || {}).forEach(k => { if (src[k] == null) src[k] = null; });
  S.budgets.m[UI.month] = src;
  persist("budgets"); render(); toast(t("saved"));
}

/* ============================ reports ============================ */
const REP_MODES = [
  { id: "month", label: () => t("thisMonth") },
  { id: "last3", label: () => t("last3") },
  { id: "last6", label: () => t("last6") },
  { id: "last12", label: () => t("last12") },
  { id: "year", label: () => t("year") },
  { id: "custom", label: () => t("custom") }
];
const REP_PAGES = [
  { id: "cat", label: () => t("byCategory") },
  { id: "trend", label: () => t("incomeVsExpense") },
  { id: "nw", label: () => t("netWorthTrend") },
  { id: "payee", label: () => t("topPayees") },
  { id: "flow", label: () => t("cashflow") }
];
function repRange() {
  const m = UI.rep.mode, cur = mkey(todayISO());
  if (m === "custom") return { from: UI.rep.from || monthStart(addMonthKey(cur, -5)), to: UI.rep.to || monthEnd(cur) };
  if (m === "month") return { from: monthStart(UI.month), to: monthEnd(UI.month) };
  if (m === "year") { const y = new Date().getFullYear(); return { from: y + "-01-01", to: y + "-12-31" }; }
  const n = m === "last3" ? 3 : m === "last12" ? 12 : 6;
  return { from: monthStart(addMonthKey(cur, -(n - 1))), to: monthEnd(cur) };
}
function monthsBetween(from, to) {
  const out = []; let k = mkey(from); const end = mkey(to); let g = 0;
  while (k <= end && g++ < 200) { out.push(k); k = addMonthKey(k, 1); }
  return out;
}
function netWorthAt(dateStr) {
  const b = {};
  S.accounts.forEach(a => { b[a.id] = Number(a.opening) || 0; });
  allTx().forEach(x => {
    if (x.date > dateStr) return;
    const amt = Number(x.amount) || 0;
    if (x.type === "expense") { if (x.acct in b) b[x.acct] -= amt; }
    else if (x.type === "income") { if (x.acct in b) b[x.acct] += amt; }
    else { if (x.acct in b) b[x.acct] -= amt; if (x.to in b) b[x.to] += Number(x.toAmount) || amt; }
  });
  let tot = 0;
  S.accounts.forEach(a => { if (!a.archived) tot += toBase(b[a.id] || 0, a.currency); });
  return r2(tot);
}
RENDERERS.reports = function () {
  const r = repRange(), list = txInRange(r.from, r.to), tt = totals(list);
  const months = monthsBetween(r.from, r.to);
  let h = '<div class="scroll-x sec">' + REP_MODES.map(m => '<button class="chip" data-rep-mode="' + m.id + '"' + (UI.rep.mode === m.id ? ' aria-pressed="true"' : "") + ">" + esc(m.label()) + "</button>").join("") + "</div>";
  if (UI.rep.mode === "custom") h += '<div class="row2 sec"><div class="field"><label>' + esc(t("from")) + '</label><input class="inp" type="date" id="rep-from" value="' + esc(r.from) + '"></div><div class="field"><label>' + esc(t("to")) + '</label><input class="inp" type="date" id="rep-to" value="' + esc(r.to) + '"></div></div>';
  h += '<div class="g4">' +
    '<div class="tile"><div class="k">' + esc(t("income")) + '</div><div class="v num pos">' + esc(fmt(tt.income)) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("expense")) + '</div><div class="v num neg">' + esc(fmt(tt.expense)) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("net")) + '</div><div class="v num ' + (tt.net < 0 ? "neg" : "pos") + '">' + esc(fmt(tt.net, null, { signed: true })) + "</div></div>" +
    '<div class="tile"><div class="k">' + esc(t("avg")) + "/" + esc(t("month")) + '</div><div class="v num neg">' + esc(fmt(r2(tt.expense / Math.max(1, months.length)))) + "</div></div></div>";
  h += '<div class="scroll-x sec">' + REP_PAGES.map(p => '<button class="chip" data-rep-page="' + p.id + '"' + (UI.rep.page === p.id ? ' aria-pressed="true"' : "") + ">" + esc(p.label()) + "</button>").join("") + "</div>";

  if (UI.rep.page === "cat") {
    const kind = UI.rep.kind === "income" ? "income" : "expense";
    const raw = sumByCat(list, kind);
    const agg = {}, counts = {};
    Object.keys(raw).forEach(cid => { const c = catById(cid); const top = c && c.parent ? c.parent : cid; agg[top] = r2((agg[top] || 0) + raw[cid]); });
    list.forEach(x => { if (x.type !== kind) return; txLines(x).forEach(l => { const c = catById(l.cat); const top = c && c.parent ? c.parent : l.cat || "_none"; counts[top] = (counts[top] || 0) + 1; }); });
    const items = Object.keys(agg).map(id => ({ id, name: id === "_none" ? t("uncategorized") : catFull(id), value: agg[id], n: counts[id] || 0 })).sort((a, b) => b.value - a.value);
    const tot = r2(items.reduce((s, i) => s + i.value, 0));
    h += '<div class="card"><div class="card-h"><h2>' + esc(t("byCategory")) + '</h2><div class="seg"><button data-rep-kind="expense"' + (kind === "expense" ? ' aria-pressed="true"' : "") + ">" + esc(t("expense")) + '</button><button data-rep-kind="income"' + (kind === "income" ? ' aria-pressed="true"' : "") + ">" + esc(t("income")) + "</button></div></div><div class=\"card-b\">";
    if (!items.length) h += emptyState(t("noTx"), "", "🥧");
    else {
      h += '<div class="tbl-wrap"><table><thead><tr><th>' + esc(t("category")) + '</th><th class="r">' + esc(t("total")) + '</th><th class="r">%</th><th class="r">' + esc(t("count")) + '</th><th class="r">' + esc(t("avg")) + "</th></tr></thead><tbody>" +
        items.map(it => '<tr class="clickable" data-rep-cat="' + esc(it.id) + '"><td>' + esc(it.name) + '</td><td class="r num">' + esc(fmt(it.value)) + '</td><td class="r num dim">' + (tot ? Math.round((it.value / tot) * 100) : 0) + '%</td><td class="r num dim">' + it.n + '</td><td class="r num dim">' + esc(fmt(r2(it.value / Math.max(1, it.n)))) + "</td></tr>").join("") +
        "</tbody></table></div>";
    }
    h += "</div></div>";
  } else if (UI.rep.page === "trend") {
    const rows = months.map(k => { const x = totals(txInRange(monthStart(k), monthEnd(k))); return { label: monthLabel(k, false), a: x.income, b: x.expense, k: k, net: x.net }; });
    h += '<div class="card"><div class="card-h"><h2>' + esc(t("incomeVsExpense")) + '</h2><span class="pill pos">' + esc(t("income")) + '</span><span class="pill neg">' + esc(t("expense")) + '</span></div><div class="card-b">' + chartGroupedBars(rows) +
      '<div class="tbl-wrap"><table><thead><tr><th>' + esc(t("month")) + '</th><th class="r">' + esc(t("income")) + '</th><th class="r">' + esc(t("expense")) + '</th><th class="r">' + esc(t("net")) + "</th></tr></thead><tbody>" +
      rows.slice().reverse().map(x => '<tr><td>' + esc(monthLabel(x.k)) + '</td><td class="r num pos">' + esc(fmt(x.a)) + '</td><td class="r num neg">' + esc(fmt(x.b)) + '</td><td class="r num ' + (x.net < 0 ? "neg" : "pos") + '">' + esc(fmt(x.net, null, { signed: true })) + "</td></tr>").join("") + "</tbody></table></div></div></div>";
  } else if (UI.rep.page === "nw") {
    const pts = months.map(k => ({ label: monthLabel(k, false), v: netWorthAt(monthEnd(k) > todayISO() ? todayISO() : monthEnd(k)), k: k }));
    const first = pts.length ? pts[0].v : 0, last = pts.length ? pts[pts.length - 1].v : 0;
    const diff = r2(last - first);
    h += '<div class="card"><div class="card-h"><h2>' + esc(t("netWorthTrend")) + '</h2><span class="pill ' + (diff < 0 ? "neg" : "pos") + ' num">' + esc(fmt(diff, null, { signed: true })) + '</span></div><div class="card-b">' + chartLine(pts) +
      '<div class="tbl-wrap"><table><thead><tr><th>' + esc(t("month")) + '</th><th class="r">' + esc(t("netWorth")) + '</th><th class="r">' + esc(LANG === "th" ? "เปลี่ยนแปลง" : "Change") + "</th></tr></thead><tbody>" +
      pts.slice().reverse().map((p, i, arr) => { const prev = arr[i + 1]; const d = prev ? r2(p.v - prev.v) : null; return '<tr><td>' + esc(monthLabel(p.k)) + '</td><td class="r num">' + esc(fmt(p.v)) + '</td><td class="r num ' + (d == null ? "dim" : d < 0 ? "neg" : "pos") + '">' + (d == null ? "—" : esc(fmt(d, null, { signed: true }))) + "</td></tr>"; }).join("") + "</tbody></table></div></div></div>";
  } else if (UI.rep.page === "payee") {
    const m = {};
    list.forEach(x => { if (x.type !== "expense") return; const p = (x.payee || "").trim() || (LANG === "th" ? "ไม่ระบุ" : "Unnamed"); const a = accById(x.acct); const rt = a ? rateOf(a.currency) : 1; m[p] = m[p] || { v: 0, n: 0 }; m[p].v = r2(m[p].v + (Number(x.amount) || 0) * rt); m[p].n++; });
    const items = Object.keys(m).map(k => ({ name: k, value: m[k].v, n: m[k].n })).sort((a, b) => b.value - a.value).slice(0, 20);
    const max = items.length ? items[0].value : 1;
    h += '<div class="card"><div class="card-h"><h2>' + esc(t("topPayees")) + '</h2></div><div class="card-b">' +
      (items.length ? items.map(it => '<div class="brow"><div class="brow-t"><span class="n">' + esc(it.name) + '</span><span class="num dim" style="font-size:12.5px">' + it.n + "×</span><span class=\"num\" style=\"font-weight:600\">" + esc(fmt(it.value)) + '</span></div><div class="bar"><i style="width:' + Math.round((it.value / max) * 100) + '%"></i></div></div>').join("") : emptyState(t("noTx"), "", "🏪")) + "</div></div>";
  } else {
    let cum = 0;
    const rows = months.map(k => { const x = totals(txInRange(monthStart(k), monthEnd(k))); cum = r2(cum + x.net); return { k, x, cum }; });
    h += '<div class="card"><div class="card-h"><h2>' + esc(t("cashflow")) + '</h2></div><div class="card-b"><div class="tbl-wrap"><table><thead><tr><th>' + esc(t("month")) + '</th><th class="r">' + esc(t("income")) + '</th><th class="r">' + esc(t("expense")) + '</th><th class="r">' + esc(t("net")) + '</th><th class="r">' + esc(LANG === "th" ? "สะสม" : "Cumulative") + "</th></tr></thead><tbody>" +
      rows.map(r2row => '<tr><td>' + esc(monthLabel(r2row.k)) + '</td><td class="r num pos">' + esc(fmt(r2row.x.income)) + '</td><td class="r num neg">' + esc(fmt(r2row.x.expense)) + '</td><td class="r num ' + (r2row.x.net < 0 ? "neg" : "pos") + '">' + esc(fmt(r2row.x.net, null, { signed: true })) + '</td><td class="r num">' + esc(fmt(r2row.cum, null, { signed: true })) + "</td></tr>").join("") +
      '</tbody><tfoot><tr><th>' + esc(t("total")) + '</th><th class="r num pos">' + esc(fmt(tt.income)) + '</th><th class="r num neg">' + esc(fmt(tt.expense)) + '</th><th class="r num">' + esc(fmt(tt.net, null, { signed: true })) + '</th><th></th></tr></tfoot></table></div></div></div>';
  }
  return h;
};

RENDERERS.after_reports = function (host) {
  const f = $("#rep-from", host), to = $("#rep-to", host);
  if (!f || !to) return;
  const apply = () => {
    if (!f.value || !to.value) return;
    UI.rep.from = f.value <= to.value ? f.value : to.value;
    UI.rep.to = f.value <= to.value ? to.value : f.value;
    render();
  };
  f.addEventListener("change", apply);
  to.addEventListener("change", apply);
};

<script>
"use strict";
/* ============================ option builders ============================ */
function catOptions(kind, selected) {
  const parents = S.categories.filter(c => c.kind === kind && !c.parent && (!c.archived || c.id === selected));
  let h = '<option value="">' + esc(t("uncategorized")) + "</option>";
  parents.forEach(p => {
    const kids = S.categories.filter(c => c.parent === p.id && (!c.archived || c.id === selected));
    if (!kids.length) { h += '<option value="' + esc(p.id) + '"' + (selected === p.id ? " selected" : "") + ">" + esc(catName(p)) + "</option>"; return; }
    h += '<optgroup label="' + esc(catName(p)) + '">';
    h += '<option value="' + esc(p.id) + '"' + (selected === p.id ? " selected" : "") + ">" + esc(catName(p)) + " — " + esc(LANG === "th" ? "ทั้งหมด" : "general") + "</option>";
    kids.forEach(k => { h += '<option value="' + esc(k.id) + '"' + (selected === k.id ? " selected" : "") + ">" + esc(catName(k)) + "</option>"; });
    h += "</optgroup>";
  });
  return h;
}
function acctOptions(selected, exclude) {
  return S.accounts.filter(a => !a.archived || a.id === selected).map(a =>
    '<option value="' + esc(a.id) + '"' + (selected === a.id ? " selected" : "") + (exclude === a.id ? " disabled" : "") + ">" + esc(acctName(a)) + (a.currency !== S.settings.currency ? " (" + esc(a.currency) + ")" : "") + "</option>").join("");
}
function payeeDatalist() {
  const names = Array.from(new Set(S.payees.map(p => p.name).concat(allTx().map(x => x.payee).filter(Boolean)))).slice(0, 400);
  return '<datalist id="payee-list">' + names.map(n => '<option value="' + esc(n) + '"></option>').join("") + "</datalist>";
}
function rememberPayee(name, catId) {
  const n = (name || "").trim(); if (!n) return;
  const found = S.payees.find(p => p.name === n);
  if (found) { if (catId) { found.lastCat = catId; found.updatedAt = Date.now(); } }
  else S.payees.push({ id: uid(), name: n, lastCat: catId || null, updatedAt: Date.now() });
  persist("payees");
}

/* ============================ transaction editor ============================ */
function txSheet(existing, preset) {
  const F = existing ? JSON.parse(JSON.stringify(existing)) : Object.assign({
    id: null, date: todayISO(), type: "expense", acct: (S.accounts.find(a => !a.archived) || {}).id || "",
    to: null, amount: "", cat: "", payee: "", note: "", tags: [], cleared: false, splits: null, toAmount: null
  }, preset || {});
  const body = document.createElement("div");

  function updateRemaining() {

  });

function saveTx(F, existing) {
  const amt = parseAmount(F.amount);
  if (!amt) { toast(t("invalidAmount")); return false; }
  if (!F.acct) { toast(t("required")); return false; }
  if (F.type === "transfer" && (!F.to || F.to === F.acct)) { toast(LANG === "th" ? "เลือกบัญชีปลายทางให้ต่างจากต้นทาง" : "Pick a different destination account"); return false; }
  let splits = null;
  if (F.splits && F.splits.length) {
    splits = F.splits.map(s => ({ cat: s.cat || null, amount: parseAmount(s.amount) || 0, note: s.note || "" })).filter(s => s.amount > 0);
    if (!splits.length) splits = null;
    else {
      const sum = r2(splits.reduce((s, x) => s + x.amount, 0));
      if (Math.abs(sum - amt) > 0.009) { toast((LANG === "th" ? "ยอดแยกหมวดไม่เท่ากับยอดรวม · ต่าง " : "Splits do not add up · off by ") + fmt(r2(amt - sum))); return false; }
    }
  }
  const tx = {
    id: F.id || uid(), date: F.date || todayISO(), type: F.type, acct: F.acct,
    to: F.type === "transfer" ? F.to : null, amount: amt,
    toAmount: F.type === "transfer" && F.toAmount ? F.toAmount : null,
    cat: F.type === "transfer" || splits ? null : F.cat || null,
    payee: F.type === "transfer" ? "" : (F.payee || "").trim(),
    note: F.note || "", tags: F.tags || [], cleared: !!F.cleared, splits: splits,
    createdAt: existing ? existing.createdAt || Date.now() : Date.now(),
    updatedAt: Date.now()
  };
  const newMk = mkey(tx.date);
  const touched = {};
  if (existing) {
    const oldMk = mkey(existing.date);
    S.tx[oldMk] = (S.tx[oldMk] || []).filter(x => x.id !== tx.id);
    if (oldMk !== newMk) markDeleted("m_" + oldMk, tx.id);   // it lives in another month now
    touched[oldMk] = 1;
  }
  (S.tx[newMk] = S.tx[newMk] || []).push(tx);
  touched[newMk] = 1;
  invalidate();
  if (tx.payee) rememberPayee(tx.payee, tx.cat);
  // An emptied month keeps its document: the tombstones in it are what tell the
  // other devices that those entries are gone.
  Object.keys(touched).forEach(mk => { S.tx[mk] = S.tx[mk] || []; persistMonth(mk); });
  render(); toast(t("saved"));
  return true;
}
function deleteTx(id) {
  Object.keys(S.tx).forEach(mk => {
    const before = (S.tx[mk] || []).length;
    S.tx[mk] = (S.tx[mk] || []).filter(x => x.id !== id);
    if (S.tx[mk].length !== before) { markDeleted("m_" + mk, id); persistMonth(mk); }
  });
  invalidate(); render(); toast(t("deleted"));
}
function findTx(id) { return allTx().find(x => x.id === id) || null; }

function deleteAccount(id) {
  markDeleted("accounts", id);
  S.accounts = S.accounts.filter(a => a.id !== id);
  Object.keys(S.tx).forEach(mk => {
    const before = S.tx[mk].length;

    S.tx[mk] = S.tx[mk].filter(x => x.acct !== id && x.to !== id);
    if (S.tx[mk].length !== before) persistMonth(mk);
  });
  S.recurring.forEach(r => { if (r.tx.acct === id || r.tx.to === id) markDeleted("recurring", r.id); });

  invalidate(); persist("accounts"); persist("recurring"); persist("index");

  render(); toast(t("deleted"));
}

      const kids = S.categories.filter(x => x.parent === c.id).map(x => x.id);

      const gone = [c.id].concat(kids);
      gone.forEach(id => markDeleted("categories", id));
      Object.keys(S.tx).forEach(mk => {

        });
        if (ch) persistMonth(mk);
      });
      gone.forEach(g => { S.budgets.tpl[g] = null; S.budgets.roll[g] = false; Object.keys(S.budgets.m).forEach(m => { S.budgets.m[m][g] = null; }); });

    });

    if (ev.target.id === "ct-kind") { c.kind = ev.target.value; c.parent = null; c.name = $("#ct-name", body).value; paint(); }

  });
  paint();

    title: c.id ? t("editCategory") : t("newCategory"), body: body,

  });

    tx: fromTx ? { type: fromTx.type, acct: fromTx.acct, to: fromTx.to, amount: parseAmount(fromTx.amount) || 0, cat: fromTx.cat || null, payee: fromTx.payee || "", note: fromTx.note || "", tags: fromTx.tags || [], cleared: false, splits: fromTx.splits || null }
      : { type: "expense", acct: (S.accounts.find(a => !a.archived) || {}).id || "", to: null, amount: 0, cat: null, payee: "", note: "", tags: [], cleared: false, splits: null },
    freq: "month", every: 1, next: advance(todayISO(), "month", 1), end: null, auto: true
  };
  const body = document.createElement("div");
  body.style.cssText = "display:flex;flex-direction:column;gap:12px";
  function paint() {
    const isX = base.tx.type === "transfer";
    body.innerHTML =
      '<div class="field"><label>' + esc(t("name")) + '</label><input class="inp" id="rc-name" data-autofocus value="' + esc(base.name) + '" placeholder="' + esc(LANG === "th" ? "เช่น ค่าเช่าบ้าน" : "e.g. Rent") + '"></div>' +
      '<div class="seg big">' + ["expense", "income", "transfer"].map(k => '<button class="t-' + k + '" data-rtype="' + k + '"' + (base.tx.type === k ? ' aria-pressed="true"' : "") + ">" + esc(t(k)) + "</button>").join("") + "</div>" +
      '<div class="row2"><div class="field"><label>' + esc(t("amount")) + '</label><input class="inp num" id="rc-amt" inputmode="decimal" value="' + esc(base.tx.amount || "") + '"></div>' +
      '<div class="field"><label>' + esc(t("account")) + '</label><select class="inp" id="rc-acct">' + acctOptions(base.tx.acct) + "</select></div></div>" +
      (isX ? '<div class="field"><label>' + esc(t("toAccount")) + '</label><select class="inp" id="rc-to">' + acctOptions(base.tx.to, base.tx.acct) + "</select></div>"
        : '<div class="field"><label>' + esc(t("category")) + '</label><select class="inp" id="rc-cat">' + catOptions(base.tx.type === "income" ? "income" : "expense", base.tx.cat) + "</select></div>" +
          '<div class="field"><label>' + esc(t("payee")) + '</label><input class="inp" id="rc-payee" list="payee-list" value="' + esc(base.tx.payee) + '">' + payeeDatalist() + "</div>") +
      '<div class="row3"><div class="field"><label>' + esc(t("every")) + '</label><input class="inp num" id="rc-every" type="number" min="1" max="99" value="' + (base.every || 1) + '"></div>' +
      '<div class="field"><label>' + esc(t("freq")) + '</label><select class="inp" id="rc-freq">' + [["day", "days"], ["week", "weeks"], ["month", "months"], ["year", "years"]].map(([v, l]) => '<option value="' + v + '"' + (base.freq === v ? " selected" : "") + ">" + esc(t(l)) + "</option>").join("") + "</select></div>" +
      '<div class="field"><label>' + esc(t("nextDate")) + '</label><input class="inp" type="date" id="rc-next" value="' + esc(base.next) + '"></div></div>' +
      '<div class="field"><label>' + esc(t("endDate")) + '</label><input class="inp" type="date" id="rc-end" value="' + esc(base.end || "") + '"></div>' +
      '<label class="chk"><input type="checkbox" id="rc-auto"' + (base.auto ? " checked" : "") + "><span>" + esc(t("autoPost")) + "</span></label>" +
      (base.id ? '<div><button class="btn sm d" data-act="rc-del">' + esc(t("del")) + "</button></div>" : "");
  }
  function sync() {
    const g = id => $("#" + id, body);
    base.name = g("rc-name").value;
    base.tx.amount = parseAmount(g("rc-amt").value) || 0;
    base.tx.acct = g("rc-acct").value;
    if (g("rc-to")) base.tx.to = g("rc-to").value;
    if (g("rc-cat")) base.tx.cat = g("rc-cat").value || null;
    if (g("rc-payee")) base.tx.payee = g("rc-payee").value;
    base.every = clamp(parseInt(g("rc-every").value, 10) || 1, 1, 99);
    base.freq = g("rc-freq").value;
    base.next = g("rc-next").value || todayISO();
    base.end = g("rc-end").value || null;
    base.auto = g("rc-auto").checked;
  }
  body.addEventListener("click", ev => {
    const b = ev.target.closest("[data-rtype]");
    if (b) { sync(); base.tx.type = b.dataset.rtype; if (base.tx.type === "transfer") { base.tx.cat = null; base.tx.splits = null; if (!base.tx.to) { const o = S.accounts.find(a => a.id !== base.tx.acct); base.tx.to = o ? o.id : null; } } paint(); }
    if (ev.target.closest('[data-act="rc-del"]')) confirmSheet(LANG === "th" ? "ลบรายการประจำนี้?" : "Delete this scheduled entry?", t("yes"), () => {
      markDeleted("recurring", base.id);
      S.recurring = S.recurring.filter(r => r.id !== base.id); persist("recurring"); closeSheet(); render(); renderRecManager(); toast(t("deleted"));
    });
  });
  paint();
  openSheet({
    title: base.id ? t("recurring") : t("newRecurring"), body: body,
    onOk: () => {
      sync();
      if (!base.name.trim() || !base.tx.amount || !base.tx.acct) { toast(t("required")); return; }
      base.tx.to = base.tx.type === "transfer" ? base.tx.to : null;
      const rec = Object.assign({}, base, {
        id: base.id || uid(), name: base.name.trim(),
        anchorDay: Number(base.next.slice(8, 10)) || 1,  // keeps "the 31st" on the 31st after a short month
        updatedAt: Date.now()
      });
      if (base.id) S.recurring = S.recurring.map(r => (r.id === base.id ? rec : r)); else S.recurring.push(rec);
      persist("recurring"); closeSheet(); render(); renderRecManager(); toast(t("saved"));
    }
  });
}
function recManager() {
  const body = document.createElement("div");
  body.id = "rec-manager";
  body.style.cssText = "display:flex;flex-direction:column;gap:4px";
  openSheet({
    title: t("recurring"), body: body,
    footer: '<button class="btn" data-sheet-close>' + esc(t("done")) + '</button><button class="btn p" data-act="rc-new">' + esc(t("add")) + "</button>"
  });
  body.addEventListener("click", ev => {
    const e = ev.target.closest("[data-edit-rec]"); if (e) recSheet(S.recurring.find(r => r.id === e.dataset.editRec));
  });
  renderRecManager();
}
function renderRecManager() {
  const body = $("#rec-manager"); if (!body) return;
  if (!S.recurring.length) { body.innerHTML = emptyState(LANG === "th" ? "ยังไม่มีรายการประจำ" : "Nothing scheduled", LANG === "th" ? "ใช้สำหรับค่าเช่า เงินเดือน ค่าสมาชิก" : "For rent, salary, subscriptions", "🔁"); return; }
  body.innerHTML = S.recurring.slice().sort((a, b) => (a.next < b.next ? -1 : 1)).map(r => {
    const a = accById(r.tx.acct);
    const freqL = t("every") + " " + (r.every > 1 ? r.every + " " : "") + t(r.freq === "day" ? "days" : r.freq === "week" ? "weeks" : r.freq === "year" ? "years" : "months");
    return '<div class="srow"><span class="l"><b>' + esc(LANG === "en" && r.en ? r.en : r.name) + "</b><span>" + esc(freqL) + " · " + esc(t("nextDate")) + " " + esc(r.next) + (r.auto ? " · " + esc(t("autoPost")) : "") + '</span></span><span class="num ' + (r.tx.type === "income" ? "pos" : "neg") + '">' + esc(fmt(r.tx.amount, a ? a.currency : null)) + '</span><button class="icon-btn" data-edit-rec="' + esc(r.id) + '">' + IC.pencil + "</button></div>";
  }).join("");
}
function postRecNow(id) {
  const rec = S.recurring.find(r => r.id === id); if (!rec) return;
  const r = postRecurring(rec);
  advanceRecurring(rec);
  persistMonth(r.mk); persist("recurring"); render(); toast(t("posted"));
}
</script>
